<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="node_modules/@fontsource/kiwi-maru/500.css">
<link rel="stylesheet" href="node_modules/@fontsource/yomogi/400.css">
<script src="node_modules/roughjs/bundled/rough.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
  #page { position: relative; width: 1600px; height: 900px; background: #FFFDF8; font-family: 'Kiwi Maru', sans-serif; color: #2A2A2A; overflow: hidden; }
  #ink { position: absolute; inset: 0; z-index: 0; }
  .layer { position: relative; z-index: 1; }
  .abs { position: absolute; }
  h1 { margin: 0; position: absolute; top: 26px; left: 0; right: 0; text-align: center; font-size: 54px; font-weight: 500; }
  h1 .hl { background: linear-gradient(transparent 62%, #FFD36B 62%); padding: 0 6px; }
  .head { position: absolute; top: 20px; left: 0; right: 0; text-align: center; font-size: 32px; }
  .tag { display: inline-block; font-size: 24px; padding: 2px 14px; border-radius: 99px; color: #fff; margin-right: 10px; vertical-align: 6px; }
  .e { position: absolute; display: block; }
  .bubble { position: absolute; display: flex; align-items: center; justify-content: center; font-family: 'Yomogi', sans-serif; font-size: 30px; text-align: center; line-height: 1.2; }
  .num { display: inline-flex; width: 40px; height: 40px; border-radius: 20px; background: #2A2A2A; color: #fff; font-size: 24px; align-items: center; justify-content: center; margin-right: 8px; vertical-align: 2px; }
  .card { position: absolute; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; padding: 10px 12px; }
  .t { font-size: 28px; }
  .t small { font-size: 22px; color: #555; }
  .d { font-size: 22px; line-height: 1.4; color: #333; }
</style>
</head>
<body>
<div id="page">
  <svg id="ink" width="1600" height="900"></svg>
  <div class="layer">
    <h1>タイトルの<span class="hl">強調部分</span></h1>
    <!-- ここに要素を置く。例:
    <div class="abs" data-rough="panel" data-fill="#FFF1CC" style="left:40px; top:120px; width:700px; height:500px">
      <div class="head">見出し</div>
      <span class="e" style="left:40px; top:100px">{{robot:160}}</span>
      <div class="bubble" data-rough="bubble" data-tail="down" style="left:220px; top:80px; width:200px; height:84px">セリフ</div>
      <div class="card" data-rough="card" style="left:30px; top:330px; width:300px; height:140px">
        <div class="t"><span class="num">1</span>工程名<small>（たとえ）</small></div>
        <div class="d">一言の説明</div>
      </div>
    </div>
    <div data-rough="arrow" data-dir="right" style="position:absolute; left:750px; top:350px; width:60px; height:60px"></div>
    -->
  </div>
</div>
<script src="ink.js"></script>
</body>
</html>
